<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta Clara — Metas do Mês</title>
  <meta name="description" content="Organize suas metas do mês com clareza." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">

  <!-- Utmify Pixel Google -->
  <script>
    window.googlePixelId = "6a5c2403330a95e4d9ed8ca6";
    var a = document.createElement("script");
    a.setAttribute("async", "");
    a.setAttribute("defer", "");
    a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel-google.js");
    document.head.appendChild(a);
  </script>

  <!-- Utmify UTM capture (CLAUDE.md: obrigatório no frontyt) -->
  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer
  ></script>

  <!-- Vturb SmartPlayer v4 -->
  <script src="https://scripts.converteai.net/lib/js/smartplayer-wc/v4/smartplayer.js" id="vturb-smartplayer-js" fetchpriority="high"></script>
  <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/035cabae-3fc2-4fcc-9aa5-028eb511b2a2/players/6a8bc3d0dc137809af12e2c6/v4/player.js", s.async=!0,document.head.appendChild(s); </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var y = document.getElementById('year');
      if (y) y.textContent = new Date().getFullYear();
    });
  </script>

  <style>
    vturb-smartplayer template, vturb-smartplayer pre,
    vturb-anchor-button > style, vturb-anchor-button > template, vturb-anchor-button > pre,
    vturb-call-action > style, vturb-call-action > template, vturb-call-action > pre,
    vturb-player > style, vturb-player > template, vturb-player > pre,
    vturb-headline > template, vturb-bezel > template, vturb-resume > template,
    vturb-controls > template, vturb-fakebar > template, vturb-thumbsniper > template,
    vturb-context-menu > template, vturb-license > template, vturb-smallplay > template,
    vturb-bigplay > template, vturb-minihook > template, vturb-smartautoplay > template { display: none !important; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mv-bg:#0a0f1e; --mv-panel:#111a30; --mv-fg:#eef2fb; --mv-fgm:#94a3c4;
      --mv-ac:#3b74f0; --mv-line:rgba(255,255,255,0.09);
    }

    body {
      background: var(--mv-bg); color: var(--mv-fg);
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; min-height: 100vh; line-height: 1.55;
    }

    .mv-bar { background: var(--mv-panel); border-bottom: 1px solid var(--mv-line); }
    .mv-bar-in {
      max-width: 980px; margin: 0 auto; padding: 16px 22px;
      display: flex; align-items: center; gap: 11px;
    }
    .mv-mark {
      width: 26px; height: 26px; border-radius: 8px; flex: 0 0 auto;
      background: var(--mv-ac);
    }
    .mv-name {
      font-size: 15px; font-weight: 800; letter-spacing: -0.2px; color: var(--mv-fg);
    }
    .mv-chip {
      margin-left: auto; font-size: 11px; font-weight: 600; color: var(--mv-fgm);
      border: 1px solid var(--mv-line); border-radius: 20px; padding: 4px 11px;
    }

    main {
      flex: 1; width: 100%; max-width: 980px; margin: 0 auto;
      padding: 26px 22px 44px;
    }

    .mv-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--mv-ac); margin-bottom: 9px;
    }
    .mv-sub {
      font-size: 14px; color: var(--mv-fgm); margin-bottom: 20px; max-width: 560px;
    }

    .mv-frame {
      background: var(--mv-panel); border: 1px solid var(--mv-line);
      border-radius: 14px; padding: 10px;
    }
    .mv-stage { background: #000; border-radius: 8px; overflow: hidden; }
    .mv-stage vturb-smartplayer { width: 100%; display: block; }

    .mv-rail {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 4px 2px; font-size: 12px; color: var(--mv-fgm);
    }
    .mv-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--mv-fgm); opacity: .6; }

    footer {
      border-top: 1px solid var(--mv-line); background: var(--mv-panel);
      padding: 20px 22px; text-align: left;
    }
    .mv-foot-in {
      max-width: 980px; margin: 0 auto; font-size: 12px; color: var(--mv-fgm);
    }

    @media (max-width: 520px) {
      .mv-bar-in { padding: 13px 16px; }
      main { padding: 20px 16px 32px; }
      .mv-frame { border-radius: 12px; padding: 7px; }
      .mv-chip { display: none; }
    }
  </style>
</head>
<body>

  <header class="mv-bar">
    <div class="mv-bar-in">
      <div class="mv-mark"></div>
      <span class="mv-name">Meta Clara</span>
      <span class="mv-chip">Sessão liberada</span>
    </div>
  </header>

  <main>
    <p class="mv-eyebrow">Conteúdo do mês</p>
    <p class="mv-sub">O material selecionado já está disponível abaixo. Deixe o som ativo para acompanhar.</p>

    <div class="mv-frame">
      <div class="mv-stage">
        <vturb-smartplayer id="vid-6a8bc3d0dc137809af12e2c6" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"></vturb-smartplayer>
      </div>
      <div class="mv-rail">
        <span>Reprodução em andamento</span>
        <span class="mv-sep"></span>
        <span>Áudio ativo</span>
      </div>
    </div>
  </main>

  <footer>
    <div class="mv-foot-in">Meta Clara &copy; <span id="year"></span></div>
  </footer>

  

</body>
</html>
