<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plano Leve — Seu Plano do Mês</title>
  <meta name="description" content="Um plano simples para as contas do mês." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Utmify Pixel Google -->
  <script>
    window.googlePixelId = "6a5c2403330a95e4d9ed8ca6";
    var a = document.createElement("script");
    a.setAttribute("async", "");
    a.setAttribute("defer", "");
    a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel-google.js");
    document.head.appendChild(a);
  </script>

  <!-- Utmify UTM capture (CLAUDE.md: obrigatório no frontyt) -->
  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer
  ></script>

  <!-- Vturb SmartPlayer v4 -->
  <script src="https://scripts.converteai.net/lib/js/smartplayer-wc/v4/smartplayer.js" id="vturb-smartplayer-js" fetchpriority="high"></script>
  <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/035cabae-3fc2-4fcc-9aa5-028eb511b2a2/players/6a8bc3d71b2904f94a7b3b7a/v4/player.js", s.async=!0,document.head.appendChild(s); </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var y = document.getElementById('ano');
      if (y) y.textContent = new Date().getFullYear();
    });
  </script>

  <style>
    vturb-smartplayer template, vturb-smartplayer pre,
    vturb-anchor-button > style, vturb-anchor-button > template, vturb-anchor-button > pre,
    vturb-call-action > style, vturb-call-action > template, vturb-call-action > pre,
    vturb-player > style, vturb-player > template, vturb-player > pre,
    vturb-headline > template, vturb-bezel > template, vturb-resume > template,
    vturb-controls > template, vturb-fakebar > template, vturb-thumbsniper > template,
    vturb-context-menu > template, vturb-license > template, vturb-smallplay > template,
    vturb-bigplay > template, vturb-minihook > template, vturb-smartautoplay > template { display: none !important; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pv-bg:#14100e; --pv-panel:#211c18; --pv-fg:#f7f2ec; --pv-fgm:#a89787;
      --pv-ac:#e8873a; --pv-line:#3d3529;
    }

    body {
      background: var(--pv-bg); color: var(--pv-fg);
      font-family: 'Figtree', 'Trebuchet MS', Verdana, sans-serif;
      display: flex; flex-direction: column; min-height: 100vh; line-height: 1.6;
    }

    .pv-head { border-bottom: 1px solid var(--pv-line); }
    .pv-head-in {
      max-width: 720px; margin: 0 auto; padding: 22px 20px 18px; text-align: center;
    }
    .pv-brand {
      font-size: 12px; font-weight: 900; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--pv-fg);
    }
    .pv-slash {
      width: 34px; height: 2px; background: var(--pv-ac);
      margin: 12px auto 0;
    }

    main {
      flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
      padding: 30px 20px 46px; text-align: center;
    }

    .pv-lead {
      font-size: 14px; color: var(--pv-fgm); margin-bottom: 22px;
    }
    .pv-lead strong { color: var(--pv-fg); font-weight: 700; }

    .pv-screen {
      position: relative; background: #000;
      border: 1px solid var(--pv-line); border-radius: 3px;
      overflow: hidden;
    }
    .pv-screen vturb-smartplayer { width: 100%; display: block; }
    .pv-flag {
      position: absolute; top: 0; right: 0; z-index: 2;
      background: var(--pv-ac); color: #221007;
      font-size: 10px; font-weight: 900; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 5px 10px;
    }

    .pv-tip {
      margin-top: 16px; font-size: 12px; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--pv-fgm);
    }

    footer {
      border-top: 1px solid var(--pv-line); padding: 22px 20px; text-align: center;
    }
    .pv-foot-in { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--pv-fgm); }

    @media (max-width: 520px) {
      .pv-head-in { padding: 18px 16px 15px; }
      main { padding: 24px 16px 34px; }
      .pv-brand { font-size: 11px; letter-spacing: 0.22em; }
    }
  </style>
</head>
<body>

  <header class="pv-head">
    <div class="pv-head-in">
      <div class="pv-brand">Plano Leve</div>
      <div class="pv-slash"></div>
    </div>
  </header>

  <main>
    <p class="pv-lead">A sessão desta semana já está <strong>liberada</strong>. Mantenha o som ligado.</p>

    <div class="pv-screen">
      <span class="pv-flag">Ao vivo</span>
      <vturb-smartplayer id="vid-6a8bc3d71b2904f94a7b3b7a" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"></vturb-smartplayer>
    </div>

    <p class="pv-tip">Reprodução iniciada</p>
  </main>

  <footer>
    <div class="pv-foot-in">Plano Leve — <span id="ano"></span></div>
  </footer>

  

</body>
</html>
