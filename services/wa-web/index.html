<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhatsApp</title>
<style>
  :root{--bg:#111b21;--panel:#202c33;--line:#2a3942;--txt:#e9edef;--dim:#8696a0;--me:#005c4b;--them:#202c33;--acc:#00a884;--bad:#f15c6d}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  a{color:#53bdeb}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--acc);color:#fff}
  button.ghost{background:transparent;color:var(--dim)}
  input,textarea{font:inherit;background:var(--line);color:var(--txt);border:0;border-radius:8px;padding:10px 12px;width:100%}
  #login{height:100%;display:flex;align-items:center;justify-content:center}
  #login form{background:var(--panel);padding:28px;border-radius:12px;width:min(90vw,340px);display:grid;gap:12px}
  #app{display:none;height:100%;grid-template-columns:360px 1fr;grid-template-rows:100%;overflow:hidden}
  #side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
  #side header{padding:10px 12px;display:flex;gap:8px;align-items:center;background:var(--panel)}
  #state{font-size:12px;color:var(--dim);white-space:nowrap}
  #state.off{color:var(--bad)}
  #list{overflow-y:auto;flex:1}
  .chat{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
  .chat:hover,.chat.on{background:var(--panel)}
  .pic{width:44px;height:44px;border-radius:50%;background:var(--line);flex:none;object-fit:cover}
  .chat .b{min-width:0;flex:1}
  .chat .n{display:flex;justify-content:space-between;gap:8px}
  .chat .n b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat .n small,.chat .p{color:var(--dim);font-size:13px}
  .chat .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:8px}
  .badge{background:var(--acc);color:#111;border-radius:12px;padding:0 7px;font-size:12px;font-weight:700;min-width:20px;text-align:center}
  #main{display:flex;flex-direction:column;min-width:0;min-height:0}
  #main header{padding:10px 12px;background:var(--panel);display:flex;gap:10px;align-items:center}
  #main header .t{flex:1;min-width:0}
  #main header small{color:var(--dim);display:block}
  #back{display:none}
  #msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:#0b141a}
  #more{align-self:center}
  .m{max-width:min(78%,640px);padding:7px 10px;border-radius:10px;background:var(--them);word-wrap:break-word;white-space:pre-wrap;position:relative}
  .m.me{align-self:flex-end;background:var(--me)}
  .m .w{font-size:12px;color:#53bdeb;font-weight:600}
  .m .ts{font-size:11px;color:var(--dim);text-align:right;margin-top:3px}
  .m img,.m video{max-width:100%;border-radius:8px;display:block;margin-bottom:4px}
  .m audio{width:min(70vw,320px);display:block}
  .m .tr{font-size:13px;color:#d1d7db;border-left:2px solid var(--acc);padding-left:8px;margin-top:6px;white-space:pre-wrap}
  .m .sys{color:var(--dim);font-style:italic}
  .day{align-self:center;background:var(--panel);color:var(--dim);font-size:12px;padding:3px 10px;border-radius:8px;margin:6px 0}
  #compose{display:flex;gap:8px;padding:10px;background:var(--panel)}
  #compose textarea{resize:none;height:44px;max-height:140px}
  #empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim)}
  #err{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9}
  @media (max-width:760px){
    #app{grid-template-columns:1fr}
    #side.hide{display:none} #main.hide{display:none}
    #back{display:inline-block}
  }
</style>
</head>
<body>
<div id="login"><form onsubmit="return doLogin(event)">
  <b style="font-size:18px">WhatsApp</b>
  <input id="pw" type="password" placeholder="senha" autocomplete="current-password" autofocus>
  <button>Entrar</button>
</form></div>

<div id="app">
  <div id="side">
    <header><input id="q" placeholder="buscar chat ou número" oninput="renderList()"><span id="state">…</span></header>
    <div id="list"></div>
  </div>
  <div id="main" class="hide">
    <header>
      <button id="back" class="ghost" onclick="closeChat()">‹</button>
      <img id="hpic" class="pic" style="width:36px;height:36px">
      <div class="t"><b id="hname"></b><small id="hnum"></small></div>
      <button class="ghost" onclick="loadChat(cur,true)">↻</button>
    </header>
    <div id="msgs"></div>
    <div id="compose">
      <textarea id="txt" placeholder="mensagem" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>
<div id="err"></div>

<script>
const $=s=>document.querySelector(s);
let chats=[],cur=null,curNum=null,curExtra="",page=1,pages=1,seen=new Set(),lastTs=0,timerL,timerC;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const fmtT=ts=>new Date(ts*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fmtD=ts=>new Date(ts*1000).toLocaleDateString('pt-BR');
const fmtDT=ts=>{const d=new Date(ts*1000),n=new Date();return d.toDateString()===n.toDateString()?fmtT(ts):d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})};
function toast(m){const e=$('#err');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)}
async function api(p,opt){const r=await fetch(p,opt);if(r.status===401){location.reload();throw new Error('login')}if(!r.ok){const t=await r.text();toast(t.slice(0,160));throw new Error(t)}return r.json()}

async function doLogin(e){e.preventDefault();try{await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({senha:$('#pw').value})});start()}catch(_){}return false}
async function start(){$('#login').style.display='none';$('#app').style.display='grid';loadList();timerL=setInterval(loadList,15000);checkState();setInterval(checkState,60000)}
async function checkState(){try{const s=await api('/api/state');const st=s.instance?.state||'?';const e=$('#state');e.textContent=st==='open'?'● conectado':'● '+st;e.className=st==='open'?'':'off'}catch(_){}}

async function loadList(){try{chats=await api('/api/chats');renderList()}catch(_){}}
function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const el=$('#list');el.innerHTML='';
  for(const c of chats){
    if(q&&!(c.name.toLowerCase().includes(q)||c.number.includes(q)))continue;
    const d=document.createElement('div');d.className='chat'+(c.jid===cur?' on':'');d.onclick=()=>openChat(c);
    const pv=(c.ptype==='text'?c.preview:'['+c.ptype+'] '+c.preview);
    d.innerHTML=`<img class="pic" src="${esc(c.pic)}" onerror="this.removeAttribute('src')" loading="lazy">
      <div class="b"><div class="n"><b>${esc(c.name||c.number)}</b><small>${c.ts?fmtDT(c.ts):''}</small></div>
      <div class="p"><span>${c.fromMe?'✓ ':(c.group&&c.who?esc(c.who)+': ':'')}${esc(pv)}</span>${c.unread?`<span class="badge">${c.unread}</span>`:''}</div></div>`;
    el.appendChild(d);
  }
}
function openChat(c){cur=c.jid;curNum=c.number;curExtra=(c.jids||[]).filter(j=>j!==c.jid).join(',');$('#hname').textContent=c.name||c.number;$('#hnum').textContent=c.group?'grupo':c.number;$('#hpic').src=c.pic||'';
  $('#side').classList.add('hide');$('#main').classList.remove('hide');renderList();loadChat(c.jid,true);
  clearInterval(timerC);timerC=setInterval(()=>loadChat(cur,false),8000)}
function closeChat(){$('#side').classList.remove('hide');$('#main').classList.add('hide');clearInterval(timerC);cur=null;renderList()}

async function loadChat(jid,reset){
  if(!jid)return;
  const box=$('#msgs');
  if(reset){box.innerHTML='';seen=new Set();page=1;lastTs=0}
  const d=await api(`/api/messages?jid=${encodeURIComponent(jid)}&page=1&extra=${encodeURIComponent(curExtra)}`);
  if(jid!==cur)return;
  if(d.number)curNum=d.number;pages=d.pages;
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  if(reset&&pages>1){const b=document.createElement('button');b.id='more';b.className='ghost';b.textContent='carregar anteriores';b.onclick=loadOlder;box.appendChild(b)}
  appendMsgs(d.messages,false);
  if(reset||atBottom)box.scrollTop=box.scrollHeight;
  const unread=d.messages.filter(m=>!m.fromMe).slice(-20).map(m=>m.id);
  if(reset&&unread.length){api('/api/read',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jid,ids:unread})}).catch(()=>{});const c=chats.find(x=>x.jid===jid);if(c){c.unread=0;renderList()}}
}
async function loadOlder(){
  if(page>=pages)return;page++;
  const box=$('#msgs');const h=box.scrollHeight;
  const d=await api(`/api/messages?jid=${encodeURIComponent(cur)}&page=${page}&extra=${encodeURIComponent(curExtra)}`);
  appendMsgs(d.messages,true);box.scrollTop=box.scrollHeight-h;
  if(page>=pages)$('#more')?.remove();
}
function appendMsgs(list,prepend){
  const box=$('#msgs');const anchor=$('#more');
  const frag=document.createDocumentFragment();let lastDay=prepend?null:box.dataset.lastDay;
  for(const m of list){
    if(seen.has(m.id))continue;seen.add(m.id);
    if(m.type==='reaction'||m.type==='other'&&/protocol|album|senderKey/i.test(m.kind||''))continue;
    const day=fmtD(m.ts);
    if(day!==lastDay){const dv=document.createElement('div');dv.className='day';dv.textContent=day;frag.appendChild(dv);lastDay=day}
    frag.appendChild(bubble(m));
  }
  if(prepend){if(anchor)anchor.after(frag);else box.prepend(frag)}else{box.appendChild(frag);box.dataset.lastDay=lastDay}
}
function bubble(m){
  const d=document.createElement('div');d.className='m'+(m.fromMe?' me':'');
  const who=(!m.fromMe&&cur.endsWith('@g.us'))?`<div class="w">${esc(m.who||m.participant)}</div>`:'';
  const src=`/api/media?jid=${encodeURIComponent(cur)}&id=${encodeURIComponent(m.id)}`;
  let body='';
  if(m.type==='text')body=linkify(m.text);
  else if(m.type==='image'||m.type==='sticker')body=`<img loading="lazy" src="${src}" onclick="window.open(this.src)">`+linkify(m.text);
  else if(m.type==='video')body=`<video controls preload="none" src="${src}"></video>`+linkify(m.text);
  else if(m.type==='audio')body=`<audio controls preload="none" src="${src}"></audio><div><button class="ghost" onclick="transcribe(this,'${m.id}')">transcrever${m.seconds?' ('+m.seconds+'s)':''}</button></div>`;
  else if(m.type==='document')body=`📎 <a href="${src}" download="${esc(m.fileName||'arquivo')}">${esc(m.fileName||'documento')}</a> `+linkify(m.text);
  else body=`<span class="sys">[${esc(m.kind||m.type)}]</span>`;
  d.innerHTML=who+body+`<div class="ts">${fmtT(m.ts)}</div>`;
  return d;
}
async function transcribe(btn,id){
  btn.disabled=true;btn.textContent='transcrevendo…';
  try{const d=await api('/api/transcribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jid:cur,id})});
    const t=document.createElement('div');t.className='tr';t.textContent=d.texto||'(vazio)';btn.parentElement.replaceWith(t)}
  catch(_){btn.disabled=false;btn.textContent='transcrever'}
}
async function sendMsg(){
  const t=$('#txt');const text=t.value.trim();if(!text||!cur)return;
  t.disabled=true;
  try{await api('/api/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({number:curNum,text})});t.value='';setTimeout(()=>loadChat(cur,false),1200)}
  finally{t.disabled=false;t.focus()}
}
fetch('/api/state').then(r=>{if(r.ok)start()});
</script>
</body>
</html>
